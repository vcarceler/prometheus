  # Job para realizar pruebas http a través de blackbox-exporter
  - job_name: "http-prober"
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx] # Usa el módulo http_2xx definido en blackbox-exporter
    static_configs:
      - targets: # Sitios a probar
          - "blog.elpuig.xeill.net"
          - "dmoj.elpuig.xeill.net"
          - "elpuig.xeill.net"
          - "moodle.elpuig.xeill.net"
